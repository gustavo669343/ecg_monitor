; PlatformIO Project Configuration File for Full ECG AI + SpO2 + ILI9488 Display on ESP32-S3 N16R8
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; --- CẤU HÌNH BỘ NHỚ ESP32-S3 N16R8 (16MB Flash QIO, 8MB PSRAM OPI) ---
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi

; --- CỔNG KẾT NỐI VÀ NẠP (CH343) ---
upload_port = COM5
monitor_port = COM5

; --- THƯ VIỆN BỔ SUNG ---
lib_deps = 
    bodmer/TFT_eSPI @ ^2.5.43
    bitbank2/AnimatedGIF @ ^2.1.1
    tanakamasayuki/TensorFlowLite_ESP32 @ ^1.0.0
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2

; --- CẤU HÌNH PHẦN CỨNG MÀN HÌNH ILI9488 & XPT2046 QUA BUILD FLAGS ---
build_flags = 
    -Os
    -DBOARD_HAS_PSRAM
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT=1
    -DILI9488_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MISO=16
    -DTFT_MOSI=13
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=11
    -DTFT_RST=9
    -DTFT_BL=14
    -DTFT_BACKLIGHT_ON=1
    -DTOUCH_CS=15
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=1000000

monitor_filters = esp32_exception_decoder
